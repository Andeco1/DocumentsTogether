spring.application.name=Documents

server.forward-headers-strategy=framework

server.address=0.0.0.0
server.port=8080

spring.datasource.url=${URL}
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Yandex S3 Configuration
yandex.s3.endpoint=https://storage.yandexcloud.net
yandex.s3.region=ru-central1
yandex.s3.access-key=${YANDEX_S3_ACCESS_KEY}
yandex.s3.secret-key=${YANDEX_S3_SECRET_KEY}
yandex.s3.bucket-name=${YANDEX_S3_BUCKET_NAME}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0

# Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
