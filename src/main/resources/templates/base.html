<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:class="${themeClass ?: 'theme-light'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: 'DocuShare'}">DocuShare</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/themes.css}">

    <th:block th:if="${additionalCSS}">
        <link rel="stylesheet" th:href="${additionalCSS}">
    </th:block>
</head>
<body>
    <header th:fragment="header">
        <h1 th:text="${headerTitle ?: 'DocuShare'}">DocuShare</h1>
        <nav>
            <a href="/" class="nav-link" data-i18n="nav.home">Главная</a>
            <a href="/library" class="nav-link" data-i18n="nav.library">Библиотека</a>
            <a href="/info.html" class="nav-link" data-i18n="nav.about">О библиотеке</a>

            <div data-guest-only>
                <a href="/docs/login" class="nav-link" data-i18n="nav.login">Войти</a>
                <a href="/docs/register" class="nav-link" data-i18n="nav.register">Регистрация</a>
            </div>

            <div data-auth-only style="display: none;">
                <a href="/profile" class="nav-link" data-i18n="nav.profile">Профиль</a>
                <a href="#" onclick="logout()" class="nav-link" data-i18n="nav.logout">Выйти</a>
            </div>
        </nav>
    </header>

    <main th:fragment="main">
        <div class="container">
            <th:block th:replace="${content}">
            </th:block>
        </div>
    </main>


    <div th:fragment="themeLanguageSwitchers" data-auth-only style="display: none;">
        <div class="preferences-panel" id="preferencesPanel">
            <h4 data-i18n="preferences.title">Настройки</h4>
            <form id="preferencesForm">
                <div class="form-group">
                    <label for="themeSelect" data-i18n="preferences.theme">Тема:</label>
                    <select id="themeSelect" name="theme">
                        <option value="light" data-i18n="preferences.themeLight">Светлая</option>
                        <option value="dark" data-i18n="preferences.themeDark">Темная</option>
                        <option value="colorblind" data-i18n="preferences.themeColorblind">Для людей с цветовой слепотой</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="languageSelect" data-i18n="preferences.language">Язык:</label>
                    <select id="languageSelect" name="language">
                        <option value="ru" data-i18n="preferences.languageRu">Русский</option>
                        <option value="en" data-i18n="preferences.languageEn">English</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" data-i18n="preferences.saveButton">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/i18n.js}"></script>

    <th:block th:if="${additionalJS}">
        <script th:src="${additionalJS}"></script>
    </th:block>

</body>
</html>
