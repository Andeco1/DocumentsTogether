<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:class="${themeClass ?: 'theme-light'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.register">Регистрация</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/themes.css}">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 data-i18n="auth.register">Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="username" data-i18n="auth.username" placeholder="Имя пользователя" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" data-i18n="auth.email" placeholder="Электронная почта" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" data-i18n="auth.password" placeholder="Пароль" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" data-i18n="auth.confirmPassword" placeholder="Подтвердите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="auth.registerButton">Зарегистрироваться</button>
        </form>
        <div id="errorMessage" class="message message-error" style="display: none;" data-i18n="auth.registerError">
            Ошибка при регистрации. Попробуйте снова.
        </div>
        <div id="successMessage" class="message message-success" style="display: none;" data-i18n="auth.registerSuccess">
            Регистрация прошла успешно! Теперь вы можете войти.
        </div>
        <div class="form-footer">
            <span data-i18n="auth.hasAccount">Уже есть аккаунт?</span> 
            <a href="/page/login" data-i18n="auth.loginLink">Войти</a>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/i18n.js}"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (password !== confirmPassword) {
        document.getElementById('errorMessage').textContent = 'Пароли не совпадают';
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('successMessage').style.display = 'none';
        return;
    }
    
    fetch('/page/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: `username=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&confirmPassword=${encodeURIComponent(confirmPassword)}`
    })
    .then(response => {
        if (response.ok) {
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            setTimeout(() => {
                window.location.href = '/page/login';
            }, 2000);
        } else {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }
    })
    .catch(error => {
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('successMessage').style.display = 'none';
    });
});
</script>

</body>
</html>
