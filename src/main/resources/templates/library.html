<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:class="${themeClass ?: 'theme-light'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="library.title">Онлайн библиотека</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/themes.css}">
</head>
<body>
    <!-- Header -->
    <header>
        <h1 data-i18n="library.title">Онлайн библиотека</h1>
        <nav>
            <a href="/" class="nav-link" data-i18n="nav.home">Главная</a>
            <a href="/info.html" class="nav-link" data-i18n="nav.about">О библиотеке</a>
            <a href="/statistics" class="nav-link" data-i18n="statistics.title">Статистика</a>
            
            <!-- Guest only links -->
            <div data-guest-only>
                <a href="/docs/login" class="nav-link" data-i18n="nav.login">Войти</a>
                <a href="/docs/register" class="nav-link" data-i18n="nav.register">Регистрация</a>
            </div>
            
            <!-- Authenticated user only links -->
            <div data-auth-only style="display: none;">
                <a href="/profile" class="nav-link" data-i18n="nav.profile">Профиль</a>
                <a href="#" onclick="logout()" class="nav-link" data-i18n="nav.logout">Выйти</a>
            </div>
        </nav>
    </header>

    <!-- Layout Container -->
    <div class="layout">
        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <p th:text="${userGreeting}" class="text-center mb-xl" data-i18n="library.greeting">Добро пожаловать в библиотеку!</p>
                
                <form class="search" method="get" action="/library">
                    <input type="text" name="q" data-i18n="library.searchPlaceholder" placeholder="Поиск по названию или автору" th:value="${q}">
                    <button type="submit" data-i18n="library.searchButton">Искать</button>
                </form>

                <section class="library-grid">
                    <article class="document-card" th:each="d : ${documents}">
                        <h3 th:text="${d.title} ?: ${d.file_name}">Название</h3>
                        <div class="text-muted mb-sm" th:text="${d.author}">Автор</div>
                        <p class="text-muted mb-md" th:text="${#strings.abbreviate(d.description, 140)}">Описание</p>
                        <div class="flex gap-sm">
                            <a th:href="@{'/library/' + ${d.documentId}}" class="btn btn-secondary btn-sm" data-i18n="library.documentDetails">Подробнее</a>
                            <a th:if="${d.file_url}" th:href="${d.file_url}" target="_blank" class="btn btn-primary btn-sm" data-i18n="library.documentDownload">Скачать</a>
                        </div>
                    </article>
                </section>
            </div>
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
        <div class="user-info">
            <h3 id="userInfo" th:text="${username}"></h3>
            <div id="userActions">
                <button onclick="logout()" class="btn btn-secondary" style="width: 100%;" data-i18n="nav.logout">Выйти</button>
            </div>
        </div>

        <div class="preferences-panel" id="preferencesPanel">
            <h4 data-i18n="preferences.title">Настройки</h4>
            <form id="preferencesForm">
                <div class="form-group">
                    <label for="themeSelect" data-i18n="preferences.theme">Тема:</label>
                    <select id="themeSelect" name="theme">
                        <option value="light" data-i18n="preferences.themeLight">Светлая</option>
                        <option value="dark" data-i18n="preferences.themeDark">Темная</option>
                        <option value="colorblind" data-i18n="preferences.themeColorblind">Для людей с цветовой слепотой</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="languageSelect" data-i18n="preferences.language">Язык:</label>
                    <select id="languageSelect" name="language">
                        <option value="ru" data-i18n="preferences.languageRu">Русский</option>
                        <option value="en" data-i18n="preferences.languageEn">English</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" data-i18n="preferences.saveButton">Сохранить</button>
                </div>
            </form>
        </div>

        <button class="btn btn-primary" id="addDocumentBtn" onclick="toggleAddDocumentPanel()" style="width: 100%; margin-bottom: var(--spacing-lg);" data-i18n="library.addDocument">
            + Добавить документ
        </button>

        <div class="add-document-panel" id="addDocumentPanel">
            <h4 data-i18n="library.addDocument">Добавить новый документ</h4>
            <form id="addDocumentForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title" data-i18n="library.documentTitle">Название:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="author" data-i18n="library.documentAuthor">Автор:</label>
                    <input type="text" id="author" name="author">
                </div>
                <div class="form-group">
                    <label for="description" data-i18n="library.documentDescription">Описание:</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="file" data-i18n="library.documentFile">Файл:</label>
                    <input type="file" id="file" name="file" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="isPublic" name="isPublic" checked>
                        <span data-i18n="library.documentPublic">Сделать публичным</span>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" data-i18n="common.add">Добавить</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleAddDocumentPanel()" data-i18n="common.cancel">Отмена</button>
                </div>
            </form>
            <div id="uploadMessage" style="margin-top: 10px; display: none;"></div>
        </div>
        </aside>
    </div>

    <!-- Footer -->
    <footer>
        <p data-i18n="landing.copyright">© 2025 eLibrary. Все права защищены.</p>
    </footer>

    <!-- JavaScript Files -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/i18n.js}"></script>

<script>
function toggleAddDocumentPanel() {
    const panel = document.getElementById('addDocumentPanel');
    panel.classList.toggle('show');
}

function showMessage(message, isSuccess) {
    if (window.commonUtils) {
        window.commonUtils.showMessage(message, isSuccess ? 'success' : 'error');
    } else {
        const messageDiv = document.getElementById('uploadMessage');
        messageDiv.textContent = message;
        messageDiv.style.display = 'block';
        messageDiv.className = `message message-${isSuccess ? 'success' : 'error'}`;

        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    // Setup document upload form
    const addDocumentForm = document.getElementById('addDocumentForm');
    if (addDocumentForm) {
        addDocumentForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const messageDiv = document.getElementById('uploadMessage');
            messageDiv.style.display = 'none';

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = window.i18nManager ? window.i18nManager.getTranslation('common.loading') : 'Загрузка...';
            submitBtn.disabled = true;

            fetch('/library/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(
                        window.i18nManager ? window.i18nManager.getTranslation('library.uploadSuccess') : 'Документ успешно загружен!', 
                        true
                    );
                    this.reset();
                    toggleAddDocumentPanel();
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                } else {
                    showMessage('Ошибка: ' + data.message, false);
                }
            })
            .catch(error => {
                showMessage('Ошибка загрузки: ' + error.message, false);
            })
            .finally(() => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });
    }

    // Setup preferences form
    const preferencesForm = document.getElementById('preferencesForm');
    if (preferencesForm) {
        preferencesForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const theme = formData.get('theme');
            const language = formData.get('language');
            
            // Update theme
            if (window.themeManager) {
                window.themeManager.switchTheme(theme);
            }
            
            // Update language
            if (window.i18nManager) {
                window.i18nManager.switchLanguage(language);
            }
            
            // Show success message
            showMessage(
                window.i18nManager ? window.i18nManager.getTranslation('preferences.saveSuccess') : 'Настройки сохранены! Перезагружаем страницу...', 
                true
            );
            
            // Reload page after a short delay
            setTimeout(() => {
                window.location.reload();
            }, 1500);
        });
    }

    // Load user preferences
    loadUserPreferences();
});

function loadUserPreferences() {
    fetch('/api/preferences')
    .then(response => response.json())
    .then(data => {
        if (data.theme && document.getElementById('themeSelect')) {
            document.getElementById('themeSelect').value = data.theme;
        }
        if (data.language && document.getElementById('languageSelect')) {
            document.getElementById('languageSelect').value = data.language;
        }
    })
    .catch(error => {
        console.error('Error loading preferences:', error);
    });
}

function logout() {
    window.location.href = '/docs/login';
}
</script>
</body>
</html>
