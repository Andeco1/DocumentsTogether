name: "DocuShare"
services:
  database:
    container_name: database
    image: postgres:15
    environment:
      POSTGRES_DB: "documentsDB"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "adminPassword"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - documents-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  migration:
    container_name: migration
    image: liquibase/liquibase:latest
    depends_on:
      - database
    volumes:
      - ./migrations:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://database:5432/documentsDB
      --changeLogFile=changelog/changelog-master.xml
      --username=admin
      --password=adminPassword
      update
  server:
    container_name: server
    build:
      context: .
      dockerfile: dockerfile
    environment:
      URL: jdbc:postgresql://database:5432/documentsDB
      USERNAME: admin
      PASSWORD: adminPassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      YANDEX_S3_ACCESS_KEY: ${YANDEX_S3_ACCESS_KEY}
      YANDEX_S3_SECRET_KEY: ${YANDEX_S3_SECRET_KEY}
      YANDEX_S3_BUCKET_NAME: ${YANDEX_S3_BUCKET_NAME}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - 8080:8080
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server


volumes:
  documents-data:
  redis-data: